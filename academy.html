<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Training Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap">
<style>
/* Layout: catalog page. Hero with brand tiles, featured row, filterable course grid with pagination, detail drawer. Single light look, Delivery Hero palette. */
:root{
  --bg:#F7F5F2; --card:#FFFFFF; --ink:#2B313B; --muted:#5B6471; --line:#E3DFD9;
  --red:#D61F26; --red-d:#B8191F; --dark:#2B313B; --soft:#FBE9EA; --ok:#1F7A4D;
  --f:'Figtree',system-ui,Arial,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:1200px;margin:0 auto}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.mark{background:var(--red);color:#fff;border-radius:10px;padding:4px 10px;font-weight:800;letter-spacing:.5px}
.langbtn{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer;min-height:40px}
.langbtn:hover{border-color:var(--red)}
.hero{background:var(--dark);color:#F7F5F2;border-radius:28px;padding:clamp(24px,5vw,56px);display:grid;gap:28px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;color:#FF9A9E;text-transform:uppercase}
h1{font-size:clamp(30px,5vw,52px);line-height:1.08;font-weight:800;margin:6px 0 14px;text-wrap:balance}
.hero p{max-width:68ch;color:#C9CFD8;font-size:clamp(16px,1.6vw,19px);margin:0}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tile{background:#3A414D;border:2px solid transparent;color:#F7F5F2;border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;font-weight:700;min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tile small{font-weight:400;color:#C9CFD8;font-size:13px}
.tile:hover{border-color:#FF9A9E}
.tile[aria-pressed=true]{background:var(--red);border-color:var(--red)}
.tile[aria-pressed=true] small{color:#fff}
.sec{padding-block:40px 8px}
.sec h2{font-size:clamp(22px,3vw,30px);font-weight:800;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.course{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.course h3{font-size:20px;line-height:1.25;margin:0;font-weight:700}
.course p{margin:0;color:var(--muted);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:13px;font-weight:700;border-radius:999px;padding:3px 12px;background:#EFEBE6;color:var(--ink)}
.tag.lob{background:var(--soft);color:var(--red-d)}
.meta{display:flex;gap:16px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.cnt{font-size:14px;color:var(--muted)}
.more{margin-top:auto;align-self:flex-start;background:none;border:0;padding:6px 0;font-weight:800;color:var(--red);cursor:pointer;letter-spacing:.5px;text-transform:uppercase;font-size:14px}
.more:hover{color:var(--red-d);text-decoration:underline}
.course.feat{border-top:5px solid var(--red)}
.filters{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 20px;align-items:end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:13px;font-weight:700;color:var(--muted)}
.fld select,.fld input{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;min-height:42px;min-width:160px}
.reset{background:none;border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:700;min-height:42px}
.reset:hover{border-color:var(--red)}
.pager{display:flex;gap:8px;justify-content:center;align-items:center;margin:28px 0 8px;flex-wrap:wrap}
.pg{min-width:42px;min-height:42px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;padding:0 14px}
.pg[aria-current=page]{background:var(--red);border-color:var(--red);color:#fff}
.pg:disabled{opacity:.4;cursor:default}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:20px;padding:32px;text-align:center;color:var(--muted)}
.cta{margin-top:40px;background:var(--soft);border-radius:24px;padding:clamp(20px,4vw,36px);display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta h2{margin:0 0 4px;font-size:24px}
.cta p{margin:0;color:var(--muted)}
.btn{background:var(--red);color:#fff;border:0;border-radius:999px;padding:12px 26px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;min-height:44px}
.btn:hover{background:var(--red-d)}
footer{margin-top:40px;padding:28px 0 40px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:14px}
footer nav{display:flex;gap:18px;flex-wrap:wrap}
footer a{font-weight:700;color:var(--ink)}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px;color:var(--muted);margin-top:16px;display:inline-block}
/* detail panel */
.scrim{position:fixed;inset:0;background:rgba(43,49,59,.55);display:flex;justify-content:flex-end;z-index:20}
.panel{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;padding:24px max(20px,env(safe-area-inset-right,0px)) 40px 24px;display:flex;flex-direction:column;gap:16px}
.panel h2{font-size:28px;line-height:1.15;margin:0}
.panel h4{margin:8px 0 4px;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--red-d)}
.panel ul{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.close{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer;min-height:40px}
.avail{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:5px 14px;font-size:14px;font-weight:700}
.chip.on{background:#E3F3EA;color:var(--ok)}
.chip.off{background:#EFEBE6;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.bar{display:flex;border-radius:12px;overflow:hidden;min-height:44px}
.bar span{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;background:var(--dark);padding:4px;text-align:center}
.bar span:nth-child(odd){background:var(--red)}
@media(max-width:900px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.tiles{grid-template-columns:repeat(2,1fr)}.fld,.fld select,.fld input{width:100%}.fld{flex:1 1 100%}}
@media(prefers-reduced-motion:no-preference){
.course{transition:transform .15s,box-shadow .15s}.course:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(43,49,59,.10)}
.hero{position:relative;overflow:hidden}
.hero>*{position:relative;z-index:1}
.hero::after{content:"";position:absolute;inset-block:0;inset-inline-end:0;width:min(60%,740px);background:url("data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20900%20300'%3E%3Cstyle%3E.r%7Bfill%3Anone%3Bstroke%3A%23fff%3Bstroke-opacity%3A.3%3Bstroke-width%3A2%3Bstroke-dasharray%3A6%2010%3Banimation%3Ad%203s%20linear%20infinite%7D%40keyframes%20d%7Bto%7Bstroke-dashoffset%3A-64%7D%7D.p%7Bfill%3A%23D61F26%3Btransform-box%3Afill-box%3Btransform-origin%3Acenter%3Banimation%3Ap%202.4s%20ease-out%20infinite%7D%40keyframes%20p%7B0%25%7Btransform%3Ascale(1)%3Bopacity%3A.9%7D100%25%7Btransform%3Ascale(2.8)%3Bopacity%3A0%7D%7D%3C%2Fstyle%3E%3Cpath%20id%3D'a'%20class%3D'r'%20d%3D'M40%20240%20C200%20240%20220%2080%20380%20100%20S600%20220%20720%20120%20S850%2060%20870%2060'%2F%3E%3Cpath%20id%3D'b'%20class%3D'r'%20d%3D'M40%20150%20C160%20150%20200%20210%20330%20190%20S520%2060%20660%2070%20S820%20160%20870%20150'%2F%3E%3Cpath%20id%3D'c'%20class%3D'r'%20d%3D'M120%20280%20C300%20270%20360%20200%20500%20210%20S740%20270%20870%20230'%2F%3E%3Cg%20fill%3D'%23fff'%20fill-opacity%3D'.9'%3E%3Ccircle%20cx%3D'380'%20cy%3D'100'%20r%3D'6'%2F%3E%3Ccircle%20cx%3D'720'%20cy%3D'120'%20r%3D'6'%2F%3E%3Ccircle%20cx%3D'330'%20cy%3D'190'%20r%3D'6'%2F%3E%3Ccircle%20cx%3D'660'%20cy%3D'70'%20r%3D'6'%2F%3E%3Ccircle%20cx%3D'500'%20cy%3D'210'%20r%3D'6'%2F%3E%3Ccircle%20cx%3D'870'%20cy%3D'150'%20r%3D'6'%2F%3E%3C%2Fg%3E%3Ccircle%20class%3D'p'%20cx%3D'380'%20cy%3D'100'%20r%3D'7'%2F%3E%3Ccircle%20class%3D'p'%20style%3D'animation-delay%3A.8s'%20cx%3D'660'%20cy%3D'70'%20r%3D'7'%2F%3E%3Ccircle%20class%3D'p'%20style%3D'animation-delay%3A1.6s'%20cx%3D'500'%20cy%3D'210'%20r%3D'7'%2F%3E%3Ccircle%20r%3D'5'%20fill%3D'%23FF9A9E'%3E%3CanimateMotion%20dur%3D'7s'%20repeatCount%3D'indefinite'%3E%3Cmpath%20href%3D'%23a'%2F%3E%3C%2FanimateMotion%3E%3C%2Fcircle%3E%3Ccircle%20r%3D'5'%20fill%3D'%23FF9A9E'%3E%3CanimateMotion%20dur%3D'9s'%20repeatCount%3D'indefinite'%3E%3Cmpath%20href%3D'%23b'%2F%3E%3C%2FanimateMotion%3E%3C%2Fcircle%3E%3Ccircle%20r%3D'5'%20fill%3D'%23FF9A9E'%3E%3CanimateMotion%20dur%3D'8s'%20repeatCount%3D'indefinite'%3E%3Cmpath%20href%3D'%23c'%2F%3E%3C%2FanimateMotion%3E%3C%2Fcircle%3E%3C%2Fsvg%3E") no-repeat right center/contain;opacity:.5;pointer-events:none;z-index:0}
[dir=rtl] .hero::after{transform:scaleX(-1)}
@media(max-width:720px){.hero::after{width:100%;opacity:.2}}
@keyframes gtaRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes gtaSlide{from{opacity:0;transform:translateX(var(--sx,40px))}to{opacity:1;transform:none}}
@keyframes gtaPulse{0%,100%{box-shadow:0 0 0 0 rgba(214,31,38,0)}50%{box-shadow:0 0 0 6px rgba(214,31,38,.25)}}
.eyebrow,.hero h1,.hero p,.hero .note{animation:gtaRise .6s cubic-bezier(.2,.7,.2,1) backwards}
.hero h1{animation-delay:.08s}.hero p{animation-delay:.16s}.hero .note{animation-delay:.24s}
.grid.enter .course{animation:gtaRise .55s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.tiles.enter .tile{animation:gtaRise .5s cubic-bezier(.2,.7,.2,1) backwards}
.tiles.enter .tile:nth-child(2){animation-delay:.05s}.tiles.enter .tile:nth-child(3){animation-delay:.1s}.tiles.enter .tile:nth-child(4){animation-delay:.15s}.tiles.enter .tile:nth-child(5){animation-delay:.2s}.tiles.enter .tile:nth-child(6){animation-delay:.25s}
.tile[aria-pressed=true]{animation:gtaPulse 2.4s ease-in-out infinite}
.panel{animation:gtaSlide .3s cubic-bezier(.2,.7,.2,1)}
.scrim{animation:gtaFade .2s ease}
.mark{animation:gtaPulse 3s ease-in-out infinite}
}
@keyframes gtaFade{from{opacity:0}to{opacity:1}}
[dir=rtl] .panel{--sx:-40px}
/* orbit */
@media(prefers-reduced-motion:no-preference){
.orbit{position:absolute;inset-inline-end:-240px;top:50%;width:540px;height:540px;margin-top:-270px;z-index:0;pointer-events:none}
.orbit .ring{position:absolute;inset:0;border:2px dashed rgba(255,255,255,.3);border-radius:50%;animation:orbSpin 50s linear infinite}
.orbit .ring::after{content:"";position:absolute;inset:70px;border:1.5px solid rgba(255,255,255,.14);border-radius:50%}
.orbit .ring i{position:absolute;left:50%;top:50%;width:104px;height:58px;margin:-29px 0 0 -52px;transform:rotate(var(--a)) translateX(270px) rotate(calc(-1*var(--a)))}
.orbit .ring i b{display:grid;place-items:center;width:100%;height:100%;border-radius:14px;overflow:hidden;background:#fff;color:#343B46;font:800 15px/1 'Figtree',system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:orbUnspin 50s linear infinite}
.orbit .ring i.hot b{}
.orbit .core{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:#D61F26;display:grid;place-items:center;color:#fff;font:800 24px/1 'Figtree',system-ui,sans-serif;letter-spacing:1px;animation:orbPulse 3s ease-out infinite}
@keyframes orbSpin{to{transform:rotate(360deg)}}
@keyframes orbUnspin{to{transform:rotate(-360deg)}}
@keyframes orbPulse{0%{box-shadow:0 0 0 0 rgba(214,31,38,.55)}100%{box-shadow:0 0 0 70px rgba(214,31,38,0)}}
@media(max-width:900px){.orbit{width:400px;height:400px;margin-top:-200px;inset-inline-end:-190px;opacity:.5}.orbit .ring i{width:78px;height:44px;margin:-22px 0 0 -39px;transform:rotate(var(--a)) translateX(200px) rotate(calc(-1*var(--a)))}.orbit .ring i b{font-size:12px}.orbit .core{width:90px;height:90px;margin:-45px 0 0 -45px;font-size:19px}}
@media(max-width:560px){.orbit{opacity:.25}}
}
/* logos */
@media(prefers-reduced-motion:no-preference){
.orbit .ring i b img{max-width:78%;max-height:70%;display:block}
.orbit .ring i b.p{background:#FB0050}
.orbit .ring i b.p img{max-width:90%}
.orbit .ring i b.bm{background:none;width:75px;margin:0 auto;box-shadow:none}
.orbit .ring i b.bm img{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media(max-width:900px){.orbit .ring i b.bm{width:57px}}
}
.tile{gap:4px}
.lg{display:grid;place-items:center;width:88px;height:46px;margin:0 auto 6px;border-radius:12px;background:#fff;overflow:hidden}
.lg img{max-width:80%;max-height:68%;display:block}
.lg.lg3{background:#FB0050}.lg.lg3 img{max-width:90%}
.lg.lg5{width:60px;background:none}.lg.lg5 img{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover;border-radius:12px}
html,body{margin:0}</style></head><body>

<div class="wrap">
  <header class="top">
    <div class="brandmark"><span class="mark">GTA</span><span id="brandName"></span></div>
    <button class="langbtn" id="langBtn" type="button"></button>
  </header>

  <section class="hero" aria-labelledby="h1"><div class="orbit" aria-hidden="true"><div class="core"><span>GTA</span></div><div class="ring"></div></div>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="h1"></h1>
      <p id="intro"></p>
      <span class="note" id="demo"></span>
    </div>
    <div>
      <div class="eyebrow" id="pickBrand" style="margin-bottom:10px"></div>
      <div class="tiles" id="tiles" role="group"></div>
    </div>
  </section>

  <section class="sec" aria-labelledby="featT">
    <h2 id="featT"></h2><p class="sub" id="featS"></p>
    <div class="grid" id="featured"></div>
  </section>

  <section class="sec" aria-labelledby="allT">
    <h2 id="allT"></h2><p class="sub" id="allS"></p>
    <div class="filters">
      <div class="fld"><label for="fLob" id="lLob"></label><select id="fLob"></select></div>
      <div class="fld"><label for="fType" id="lType"></label><select id="fType"></select></div>
      <div class="fld"><label for="fQ" id="lQ"></label><input id="fQ" type="search"></div>
      <button class="reset" id="reset" type="button"></button>
    </div>
    <div class="cnt" id="count" aria-live="polite"></div>
    <div class="grid" id="all" style="margin-top:12px"></div>
    <nav class="pager" id="pager" aria-label="Pages"></nav>
  </section>

  <section class="cta">
    <div><h2 id="ctaT"></h2><p id="ctaS"></p></div>
    <a class="btn" id="ctaB" href="https://ahmedosheiba-netizen.github.io/single-source-of-training/" target="_blank" rel="noopener"></a>
  </section>

  <footer>
    <span id="foot"></span>
    <nav id="flinks"></nav>
  </footer>
</div>

<div id="drawer" hidden></div>

 ctaT:L('See how the content stays in sync','شاهد كيف يبقى المحتوى متزامنًا'),ctaS:L('Open the Single Source of Training prototype: curriculum, assessments, nesting and the change log.','افتح نموذج Single Source of Training: المنهج والتقييمات والنزول للعمل وسجل التغييرات.'),ctaB:L('Open the prototype','افتح النموذج'),
 foot:L('© Global Training Academy. Fictional data for demonstration.','© أكاديمية التدريب العالمية. بيانات وهمية للعرض.'),
 close:L('Close','إغلاق'),
 obj:L('What learners can do after the course','ماذا يستطيع المتدرب بعد الكورس'),
 avail:L('Available in','متاح في'),
 fmt:L('Standard 90-minute session format','هيكل الجلسة القياسية (90 دقيقة)'),
 dur:L('Duration','المدة'),lvl:L('Level','المستوى'),ver:L('Version','النسخة'),own:L('Owner','المالك'),line:L('Line of business','خط العمل'),type:L('Type','النوع'),
 live:L('live','متاح'),soon:L('not yet','غير متاح'),
 seg:[['Opening','افتتاح',10],['Explanation','شرح',25],['Practice','تطبيق',30],['Knowledge check','اختبار',15],['Wrap-up','ختام',10]],
 links:[L('About the Academy','عن الأكاديمية'),L('Course owners','مالكو الكورسات'),L('Suggest a course','اقترح كورسًا')]
};
let lang='e';try{lang=localStorage.getItem('gta-lang')||'e'}catch(e){}
const S={brand:-1,lob:'',type:'',q:'',page:1};
const PER=6;
const $=i=>document.getElementById(i);
const t=o=>o[lang];
const f=(s,m)=>s.replace(/\{(\w+)\}/g,(_,k)=>m[k]);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function match(c,ignoreFilters){
  if(S.brand>=0&&!c.b.includes(S.brand))return false;
  if(ignoreFilters)return true;
  if(S.lob&&c.lob!==S.lob&&c.lob!=='all')return false;
  if(S.type&&c.type!==S.type)return false;
  if(S.q){const h=(c.t.e+' '+c.t.a+' '+c.d.e+' '+c.d.a+' '+c.id).toLowerCase();if(!h.includes(S.q.toLowerCase()))return false}
  return true;
}
function card(c,feat,i){
  return '<article class="course'+(feat?' feat':'')+'" style="--i:'+(i||0)+'"><div class="tags"><span class="tag lob">'+esc(t(LOB[c.lob]))+'</span><span class="tag">'+esc(t(TYPE[c.type]))+'</span></div>'+
  '<h3>'+esc(t(c.t))+'</h3><p>'+esc(t(c.d))+'</p>'+
  '<div class="meta"><span>'+esc(t(c.dur))+'</span><span>'+esc(t(c.lvl))+'</span><span>v'+c.v+'</span></div>'+
  '<button class="more" type="button" data-id="'+c.id+'">'+esc(t(U.more))+' &rarr;</button></article>';
}
function play(){const ids=['tiles','featured','all'];ids.forEach(id=>{const e=document.getElementById(id);e.classList.remove('enter');void e.offsetWidth;e.classList.add('enter')});clearTimeout(window._et);window._et=setTimeout(()=>ids.forEach(id=>document.getElementById(id).classList.remove('enter')),1600)}
function countUp(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;document.querySelectorAll('#tiles .tile small').forEach(el=>{const txt=el.textContent,m=txt.match(/\d+/);if(!m)return;const end=+m[0],pre=txt.slice(0,m.index),post=txt.slice(m.index+m[0].length),t0=performance.now();(function step(now){const p=Math.min(1,(now-t0)/900),e=1-Math.pow(1-p,3);if(p<1){el.textContent=pre+Math.round(end*e)+post;requestAnimationFrame(step)}else el.textContent=txt})(t0)})}function render(){
  document.documentElement.lang=lang==='a'?'ar':'en';
  document.documentElement.dir=lang==='a'?'rtl':'ltr';
  document.title=lang==='a'?'أكاديمية التدريب العالمية':'Global Training Academy';
  $('langBtn').textContent=lang==='a'?'English':'العربية';
  $('brandName').textContent=t(U.brand);$('eyebrow').textContent=t(U.eye);$('h1').textContent=t(U.h1);
  $('intro').textContent=t(U.intro);$('demo').textContent=t(U.demo);$('pickBrand').textContent=t(U.pick);
  $('featT').textContent=t(U.featT);$('featS').textContent=t(U.featS);$('allT').textContent=t(U.allT);$('allS').textContent=t(U.allS);
  $('lLob').textContent=t(U.lLob);$('lType').textContent=t(U.lType);$('lQ').textContent=t(U.lQ);$('reset').textContent=t(U.reset);
  $('ctaT').textContent=t(U.ctaT);$('ctaS').textContent=t(U.ctaS);$('ctaB').textContent=t(U.ctaB);$('foot').textContent=t(U.foot);
  $('flinks').innerHTML=U.links.map(l=>'<a href="#" onclick="return false">'+esc(t(l))+'</a>').join('');
  // tiles
  $('tiles').innerHTML=BR.map((b,i)=>{const n=C.filter(c=>c.b.includes(i)).length;
    return '<button class="tile" type="button" data-b="'+i+'" aria-pressed="'+(S.brand===i)+'"><span class="lg lg'+i+'"><img src="'+LOGO[i]+'" alt=""></span>'+esc(b)+'<small>'+n+' '+esc(t(U.courses))+'</small></button>'}).join('');
  // selects
  $('fLob').innerHTML='<option value="">'+esc(t(U.anyLob))+'</option>'+['cs','rd','vd'].map(k=>'<option value="'+k+'"'+(S.lob===k?' selected':'')+'>'+esc(t(LOB[k]))+'</option>').join('');
  $('fType').innerHTML='<option value="">'+esc(t(U.anyType))+'</option>'+Object.keys(TYPE).map(k=>'<option value="'+k+'"'+(S.type===k?' selected':'')+'>'+esc(t(TYPE[k]))+'</option>').join('');
  $('fQ').value=S.q;
  // featured
  const feat=C.filter(c=>c.feat&&match(c,true));
  $('featured').innerHTML=feat.length?feat.map((c,i)=>card(c,true,i)).join(''):'<div class="empty">'+esc(t(U.none))+'</div>';
  // all
  const list=C.filter(c=>match(c));
  const pages=Math.max(1,Math.ceil(list.length/PER));
  if(S.page>pages)S.page=pages;
  const slice=list.slice((S.page-1)*PER,S.page*PER);
  $('count').textContent=S.brand>=0?f(t(U.showB),{n:list.length,b:BR[S.brand]}):f(t(U.show),{n:list.length});
  $('all').innerHTML=slice.length?slice.map((c,i)=>card(c,false,i)).join(''):'<div class="empty" style="grid-column:1/-1">'+esc(t(U.none))+'</div>';
  let p='';
  if(pages>1){
    p+='<button class="pg" type="button" data-p="'+(S.page-1)+'"'+(S.page===1?' disabled':'')+'>'+esc(t(U.prev))+'</button>';
    for(let i=1;i<=pages;i++)p+='<button class="pg" type="button" data-p="'+i+'"'+(i===S.page?' aria-current="page"':'')+'>'+i+'</button>';
    p+='<button class="pg" type="button" data-p="'+(S.page+1)+'"'+(S.page===pages?' disabled':'')+'>'+esc(t(U.next))+'</button>';
  }
  $('pager').innerHTML=p;
  if(S.anim||!window._first){window._first=1;S.anim=false;play();if(!window._cu){window._cu=1;countUp()}}
  if(!$('drawer').hidden&&S.open)openCourse(S.open);
}
function openCourse(id){
  const c=C.find(x=>x.id===id);if(!c)return;S.open=id;
  const chips=BR.map((b,i)=>'<span class="chip '+(c.b.includes(i)?'on':'off')+'">'+esc(b)+' · '+esc(t(c.b.includes(i)?U.live:U.soon))+'</span>').join('');
  const bar=U.seg.map(s=>'<span style="flex:'+s[2]+'">'+esc(lang==='a'?s[1]:s[0])+' '+s[2]+'</span>').join('');
  $('drawer').innerHTML='<div class="scrim" id="scrim"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="pt">'+
   '<button class="close" id="closeBtn" type="button">'+esc(t(U.close))+'</button>'+
   '<div class="tags"><span class="tag lob">'+esc(t(LOB[c.lob]))+'</span><span class="tag">'+esc(t(TYPE[c.type]))+'</span><span class="tag">'+c.id+'</span></div>'+
   '<h2 id="pt">'+esc(t(c.t))+'</h2><p style="margin:0;color:var(--muted)">'+esc(t(c.d))+'</p>'+
   '<dl class="kv"><dt>'+esc(t(U.dur))+'</dt><dd>'+esc(t(c.dur))+'</dd><dt>'+esc(t(U.lvl))+'</dt><dd>'+esc(t(c.lvl))+'</dd><dt>'+esc(t(U.ver))+'</dt><dd>v'+c.v+'</dd><dt>'+esc(t(U.own))+'</dt><dd>'+esc(c.own)+'</dd></dl>'+
   '<h4>'+esc(t(U.obj))+'</h4><ul>'+c.o.map(o=>'<li>'+esc(t(o))+'</li>').join('')+'</ul>'+
   '<h4>'+esc(t(U.fmt))+'</h4><div class="bar" aria-hidden="true">'+bar+'</div>'+
   '<h4>'+esc(t(U.avail))+'</h4><div class="avail">'+chips+'</div></div></div>';
  $('drawer').hidden=false;
  $('closeBtn').focus();
}
function closeCourse(){S.open=null;$('drawer').hidden=true}
document.addEventListener('click',e=>{
  const tl=e.target.closest('.tile');if(tl){const i=+tl.dataset.b;S.brand=S.brand===i?-1:i;S.page=1;S.anim=true;render();return}
  const m=e.target.closest('.more');if(m){openCourse(m.dataset.id);return}
  const pg=e.target.closest('.pg');if(pg&&!pg.disabled){S.page=+pg.dataset.p;S.anim=true;render();$('allT').scrollIntoView({behavior:'smooth',block:'start'});return}
  if(e.target.id==='scrim'||e.target.id==='closeBtn'){closeCourse();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('drawer').hidden)closeCourse()});
$('fLob').addEventListener('change',e=>{S.lob=e.target.value;S.page=1;S.anim=true;render()});
$('fType').addEventListener('change',e=>{S.type=e.target.value;S.page=1;S.anim=true;render()});
$('fQ').addEventListener('input',e=>{S.q=e.target.value;S.page=1;const pos=e.target.selectionStart;render();const q=$('fQ');q.focus();try{q.setSelectionRange(pos,pos)}catch(x){}});
$('reset').addEventListener('click',()=>{S.brand=-1;S.lob='';S.type='';S.q='';S.page=1;S.anim=true;render()});
$('langBtn').addEventListener('click',()=>{lang=lang==='a'?'e':'a';try{localStorage.setItem('gta-lang',lang)}catch(e){}render()});
render();
</script>
</body></html>
